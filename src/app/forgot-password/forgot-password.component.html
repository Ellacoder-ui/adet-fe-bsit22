<section class="fp-page">
  <div class="fp-card">
    <div class="fp-logo">
      <span class="fp-eyebrow">Student Portal</span>
    </div>

    <!-- Reset form -->
    <ng-container *ngIf="!success()">
      <div class="fp-header">
        <h1>Reset Password</h1>
        <p>Enter your email and a new password to reset your account.</p>
      </div>

      <div *ngIf="error()" class="warning-message">{{ error() }}</div>

      <form (ngSubmit)="handleSubmit()" novalidate class="fp-form">
        <div class="form-group">
          <label for="fp-email">LDCU Email</label>
          <input
            id="fp-email"
            name="fp-email"
            type="text"
            [(ngModel)]="email"
            placeholder="yourname@liceo.edu.ph"
            autocomplete="off"
            required
          />
          <p class="hint-text">You can type just your username — @liceo.edu.ph will be added automatically.</p>
        </div>

        <div class="form-group">
          <label for="fp-new">New Password</label>
          <div class="password-wrap">
            <input
              id="fp-new"
              name="fp-new"
              [type]="showPassword() ? 'text' : 'password'"
              autocomplete="new-password"
              [(ngModel)]="newPassword"
              placeholder="At least 5 characters"
              required
            />
            <button type="button" class="toggle-pw" (click)="toggleShowPassword()">
              <svg *ngIf="!showPassword()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg *ngIf="showPassword()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="fp-confirm">Confirm New Password</label>
          <div class="password-wrap">
            <input
              id="fp-confirm"
              name="fp-confirm"
              [type]="showConfirm() ? 'text' : 'password'"
              autocomplete="new-password"
              [(ngModel)]="confirmPassword"
              placeholder="Re-enter your new password"
              required
            />
            <button type="button" class="toggle-pw" (click)="toggleShowConfirm()">
              <svg *ngIf="!showConfirm()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg *ngIf="showConfirm()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-button" [disabled]="isLoading()">
          {{ isLoading() ? 'Saving...' : 'Confirm Reset Password' }}
        </button>
      </form>
    </ng-container>

    <!-- Success -->
    <ng-container *ngIf="success()">
      <div class="success-box">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="9 12 11 14 15 10"></polyline>
          </svg>
        </div>
        <h2>Password Reset!</h2>
        <p>Your password has been updated. Redirecting you to login...</p>
      </div>
    </ng-container>

    <button type="button" class="back-link" (click)="goBack()" *ngIf="!success()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Back to Login
    </button>
  </div>
</section>
