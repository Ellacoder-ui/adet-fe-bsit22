<section class="rp-page">
  <div class="rp-card">
    <div class="rp-logo">
      <span class="rp-eyebrow">Student Portal</span>
    </div>

    <!-- Verifying token -->
    <div *ngIf="isVerifying()" class="rp-verifying">
      <div class="spinner"></div>
      <p>Verifying reset link...</p>
    </div>

    <!-- Token invalid -->
    <ng-container *ngIf="!isVerifying() && !tokenValid() && !success()">
      <div class="rp-header">
        <h1>Link Expired</h1>
        <p>This reset link is invalid or has already expired.</p>
      </div>
      <div class="warning-message">{{ error() }}</div>
      <button type="button" class="submit-button" (click)="goToForgot()">
        Request a New Link
      </button>
    </ng-container>

    <!-- Reset form -->
    <ng-container *ngIf="!isVerifying() && tokenValid() && !success()">
      <div class="rp-header">
        <h1>Set New Password</h1>
        <p>Choose a strong password for your account.</p>
      </div>

      <div *ngIf="error()" class="warning-message">{{ error() }}</div>

      <form (ngSubmit)="handleSubmit()" novalidate class="rp-form">
        <div class="form-group">
          <label for="rp-new">New Password</label>
          <div class="password-wrap">
            <input
              id="rp-new"
              name="rp-new"
              [type]="showPassword() ? 'text' : 'password'"
              autocomplete="new-password"
              [(ngModel)]="newPassword"
              placeholder="At least 5 characters"
              required
            />
            <button type="button" class="toggle-pw" (click)="toggleShowPassword()" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
              <svg *ngIf="!showPassword()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg *ngIf="showPassword()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="rp-confirm">Confirm Password</label>
          <div class="password-wrap">
            <input
              id="rp-confirm"
              name="rp-confirm"
              [type]="showConfirm() ? 'text' : 'password'"
              autocomplete="new-password"
              [(ngModel)]="confirmPassword"
              placeholder="Re-enter your password"
              required
            />
            <button type="button" class="toggle-pw" (click)="toggleShowConfirm()" [attr.aria-label]="showConfirm() ? 'Hide password' : 'Show password'">
              <svg *ngIf="!showConfirm()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg *ngIf="showConfirm()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-button" [disabled]="isLoading()">
          {{ isLoading() ? 'Saving...' : 'Reset Password' }}
        </button>
      </form>
    </ng-container>

    <!-- Success -->
    <ng-container *ngIf="success()">
      <div class="success-box">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="9 12 11 14 15 10"></polyline>
          </svg>
        </div>
        <h2>Password Reset!</h2>
        <p>Your password has been updated. Redirecting you to login...</p>
      </div>
    </ng-container>
  </div>
</section>
