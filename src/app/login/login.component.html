<section class="login-page">
  <div class="login-card">
    <div class="login-intro">
      <span class="login-eyebrow">Cashier Portal Access</span>
      <h1>{{ roleLabel() }} Login</h1>
      <p>Enter your credentials to continue. This portal supports both student and staff access.</p>
    </div>

    <div *ngIf="warning()" class="warning-message">{{ warning() }}</div>

    <form class="login-form" (ngSubmit)="handleSubmitClicked()" novalidate>
      <div class="form-group">
        <label for="fullName">{{ emailLabel }}</label>
        <input
          id="fullName"
          name="fullName"
          type="text"
          [(ngModel)]="email"
          [placeholder]="emailPlaceholder"
          required
        />
      </div>

      <div class="form-group">
        <label for="idNumber">{{ passwordLabel }}</label>
        <input
          id="idNumber"
          name="idNumber"
          type="text"
          [(ngModel)]="password"
          [placeholder]="passwordPlaceholder"
          required
        />
      </div>

      <button type="submit" class="submit-button">Continue</button>
    </form>

    <div class="login-footnote">
      <p>Selected role: <strong>{{ roleLabel() }}</strong></p>
      <a routerLink="/" class="back-link">Back to role selection</a>
    </div>
  </div>
</section>
